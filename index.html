<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#E57373" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Cuisenio" />

    <!-- SEO -->
    <title>Cuisenio — Partagez vos recettes</title>
    <meta name="description" content="Cuisenio est la plateforme culinaire pour découvrir, partager et planifier vos recettes préférées. Rejoignez notre communauté de passionnés de cuisine." />
    <meta name="keywords" content="recettes, cuisine, communauté culinaire, meal planner, partager recettes, Cuisenio" />
    <meta name="author" content="Cuisenio" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cuisenio" />
    <meta property="og:title" content="Cuisenio — Partagez vos recettes" />
    <meta property="og:description" content="Découvrez, partagez et planifiez vos recettes avec la communauté Cuisenio." />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:image" content="/pwa-512.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cuisenio — Partagez vos recettes" />
    <meta name="twitter:description" content="Découvrez, partagez et planifiez vos recettes avec la communauté Cuisenio." />
    <meta name="twitter:image" content="/pwa-512.png" />

    <!-- Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/pwa-192.png" />
    <link rel="apple-touch-icon" href="/pwa-192.png" />

    <meta http-equiv="X-Content-Type-Options" content="nosniff" />

    <!-- Anti-FOUC: apply theme class before React mounts -->
    <script>
      (function () {
        try {
          var key = "cuisenio-theme";
          var raw = localStorage.getItem(key);
          var theme = "dark";
          if (raw) {
            try {
              var parsed = JSON.parse(raw);
              if (parsed && (parsed.state === "light" || parsed.state === "dark")) theme = parsed.state;
              else if (parsed === "light" || parsed === "dark") theme = parsed;
            } catch (_) {
              if (raw === "light" || raw === "dark") theme = raw;
            }
          } else {
            var legacy = localStorage.getItem("ui-theme");
            if (legacy === "light") theme = "light";
          }
          document.documentElement.classList.remove("light", "dark");
          document.documentElement.classList.add(theme);
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme === "dark" ? "dark" : "light";
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", theme === "dark" ? "#E8615C" : "#2F7A4D");
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
